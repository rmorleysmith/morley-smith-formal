# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The silent shells of the cubic lattice: 4^a(8b+7) is not a sum of three squares"
  description: >-
    No integer of the form 4^a (8b + 7) is a sum of three squares of integers; equivalently the
    sphere of squared radius 4^a (8b + 7) about a point of the cubic lattice Z^3 contains no
    lattice point. This is the direction of the three-square theorem of Legendre and Gauss
    that needs no theory of quadratic forms. Method: squares are 0, 1 or 4 modulo 8, so three
    of them never sum to 7 modulo 8; if a sum of three squares is divisible by 4 then each
    term is even, and dividing by 4 lowers a. The converse (every other positive integer is a
    sum of three squares) is not part of this entry.
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11E25", "11P05"]

sources:
  - title: "Representations of Integers as Sums of Squares"
    authors:
      - "Emil Grosswald"
    id: "Springer, 1985, ISBN 978-0-387-96126-2"
    type: "book"
    relationship: "independently-proves"
    note: >-
      Standard reference for the three-square theorem (Chapter 4). Cited from memory for the
      statement; the chapter number and the ISBN were not checked against the book. The
      proof formalised here is the usual descent modulo 8 and 4 and was written directly.
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Fully proved. Only the necessity direction of the three-square theorem. Not included:
    the converse; the count of representations (Gauss); any statement about waves.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The author asked for the results of a set of notes on lattices of impulses to be
        formalised. Claude, through Claude Code, chose this statement, wrote the statements and
        the Lean proofs, and the Lean kernel and Comparator verified the result.
      cost:
        wall_time: "under an hour"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: "The Challenge and the proofs import only Mathlib."

fidelity:
  divergences: >-
    None for the first statement. The second states the same fact for vectors indexed by
    Fin 3.

review:
  status: "self-assessed"
  reviewers: []
  notes: "Not independently reviewed."

alignment:
  namespace: "SilentShells"
  statements:
    - source: "4^a (8b + 7) is not a sum of three squares"
      lean: "SilentShells.sum_three_sq_ne"
      module: "MorleySmithFormal.SilentShells.Challenge"
      status: "proved"
    - source: "The corresponding shell of Z^3 is empty"
      lean: "SilentShells.shell_eq_empty"
      module: "MorleySmithFormal.SilentShells.Challenge"
      status: "proved"
