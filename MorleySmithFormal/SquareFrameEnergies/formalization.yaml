version: "v0.4"

project:
  name: "Determinant-one integer matrices: (a - d)^2 + (b + c)^2 takes exactly the values n with n and n + 4 sums of two squares"
  description: >-
    For an integer matrix (a b; c d) of determinant one, a^2 + b^2 + c^2 + d^2 - 2 = (a - d)^2 + (b + c)^2
    and (a - d)^2 + (b + c)^2 + 4 = (a + d)^2 + (b - c)^2. An integer n equals (a - d)^2 + (b + c)^2 for
    such a matrix exactly when n and n + 4 are both sums of two squares. Method: the identities give one
    direction; for the other, a square is congruent modulo 4 to its residue modulo 2, so the parities of
    two representations n = p^2 + q^2 and n + 4 = r^2 + s^2 can be matched (swapping r and s if needed),
    and a = (r + p)/2, d = (r - p)/2, b = (q + s)/2, c = (q - s)/2 has determinant one. In note 13 of
    the repository l-functions-and-physics, tr(g g^T)/2 is the Lorentz factor of the square lattice
    frame moved by g, and (a - d)^2 + (b + c)^2 is twice its kinetic energy in units of the rest energy.
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT"]          # one or two arXiv categories
  msc2020: ["11E25", "11F06"]

