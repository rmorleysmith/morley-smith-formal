# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Ramanujan's congruences for the one-dimensional cusp spaces"
  description: >-
    A general theorem and its six instances. The theorem (congr_of): let k = 12 + 4a + 6b; if
    the space M_{k−12} of level-one modular forms has rank one and 2k/B_k = D/ℓ with ℓ and D
    coprime integers, then the q-expansion coefficients of Δ·E₄^a·E₆^b are integers congruent
    to σ_{k−1}(n) modulo ℓ, for every n. The hypothesis holds exactly for k = 12, 16, 18, 20,
    22, 26, where the cusp space is spanned by this one form, and the instances are the
    congruences modulo the numerator of B_k/2k: 691, 3617, 43867, 174611 = 283·617,
    77683 = 131·593 and 657931. The case k = 12 is Ramanujan's τ(n) ≡ σ₁₁(n) (mod 691); the
    other five are the remaining congruences of this kind at level one. The statements are for
    every n and use only Mathlib definitions; the Bernoulli numbers B_12 to B_26 are computed
    in Lean, not assumed. Integrality comes from the product formula for Δ, expanded by Mathlib's pentagonal number
    theorem, and the integer coefficients 240σ₃ and −504σ₅ of E₄ and E₆. The congruence
    comes from one exact identity in M_k: E₄^(a+3)·E₆^b − E_k vanishes at the cusp, so dividing
    by Δ (Mathlib's discriminantEquiv) gives a form in M_{k−12}, which is one-dimensional and
    spanned by E₄^a·E₆^b; hence E₄^(a+3)·E₆^b − E_k = c·Δ·E₄^a·E₆^b, with c read off from the
    q¹-coefficient. Since E_k = 1 − (2k/B_k)∑σ_{k−1}(n)qⁿ, multiplying by the numerator of
    B_k/2k and reducing shows that the Eisenstein series is congruent to the cusp form. The
    argument is proved once for general (a, b) and applied to the six cases.
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11F33", "11F11", "11B68"]

sources:
  - title: "On certain arithmetical functions"
    authors:
      - "S. Ramanujan"
    id: "Transactions of the Cambridge Philosophical Society 22 (1916)"
    type: "paper"
    relationship: "independently-proves"
    note: >-
      Source of the congruence τ(n) ≡ σ₁₁(n) (mod 691), the case k = 12. The Lean proof
      follows the standard modern argument (an identity between E₄³, E₁₂ and Δ in M₁₂, then
      clearing the denominator 691) rather than the text of the paper. The location of the
      congruence within the paper was not checked for this file.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On ℓ-adic representations and congruences for coefficients of modular forms"
    authors:
      - "H. P. F. Swinnerton-Dyer"
    id: "Modular Functions of One Variable III, Lecture Notes in Mathematics 350, Springer (1973)"
    type: "paper"
    relationship: "independently-proves"
    note: >-
      Treats the congruences for the coefficients of the cusp forms of weights 12, 16, 18, 20,
      22, 26 modulo the primes dividing the numerator of B_k/2k, as part of the theory of the
      attached ℓ-adic representations. The Lean proof does not use that theory: it is the
      elementary argument through an exact identity in M_k. The Lean statements use the full
      numerator (283·617 and 131·593 for k = 20, 22), which is equivalent to the congruence
      modulo each prime. The exact form of the statements in the paper, and their section and
      page, were not checked for this file.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/rmorleysmith/fugue-formal/tree/v1.0.0"
    relationship: "builds-on"
    note: >-
      Fugue/Tau691.lean (Lean v4.34.1) proves the case k = 12. Its pieces (integrality of Δ via
      the pentagonal series, the identity E₄³ − E₁₂ = (432000/691)Δ, clearing the
      denominator) are ported to Lean v4.35.0 and the module system and generalised to
      E₄^(a+3)·E₆^b − E_k = c·Δ·E₄^a·E₆^b for every (a, b) with M_{4a+6b} one-dimensional.
  - id: "https://github.com/TauCetiProject/TauCeti/tree/83769e442d55cda9d85b3927a93b286831c595ff"
    relationship: "other"
    note: >-
      Not used. At this commit (10 November 2026) TauCeti has the identity
      E₄³ − 720Δ = E₁₂ − (65520/691)Δ (ThetaSeries/Leech.lean) and the multiplicativity of τ,
      but a text search of its modular-forms directory for the six moduli found no congruence
      between a cusp form and an Eisenstein series. The same search of Mathlib v4.35.0 found
      none. The five congruences for k = 16 to 26 were not found formalised anywhere searched.

status:
  scope: >-
    Fully proved: the general theorem congr_of and all six congruences (k = 12, 16, 18, 20, 22,
    26), each with the integrality of the coefficients. congr_of covers any (a, b) for which
    M_{4a+6b} has rank one, given 2k/B_k = D/ℓ with ℓ and D coprime; the six instances supply
    the rank from Mathlib's dimension formula and the Bernoulli numbers from Bernoulli.lean.
    Not included: weights where the cusp space has dimension above one (k = 24 and k ≥ 28),
    where the congruence holds for a combination of eigenforms and needs a different argument;
    the Hecke eigenform property of these forms; and the finer congruences for τ modulo powers
    of 2, 3, 5, 7 and modulo 23.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The author directed the work; Claude, through Claude Code (a coordinating session and
        one subagent), wrote the statements and the Lean proofs, and the Lean kernel and
        Comparator verified the result.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: >-
    The moduli were checked in Python as the numerators of B_k/2k, and the six congruences were
    checked numerically for n < 40 before the proof. The Challenge uses only Mathlib definitions
    (UpperHalfPlane.qExpansion, CuspForm.discriminant, E₄, E₆, ArithmeticFunction.sigma).

fidelity:
  divergences: >-
    The forms are stated as products of Mathlib's q-expansions of Δ, E₄ and E₆, not as an
    abstract normalised generator of S_k; Basic.lean shows that this product is, up to a
    constant, E₄^(a+3)·E₆^b − E_k. The general theorem takes the rank of M_{k−12} and the
    value of 2k/B_k as hypotheses, so that it is one statement; the six instances discharge
    both. For k = 20 and 22 the modulus is the product of the two
    primes rather than each prime separately, which is equivalent.

review:
