# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The theta series of an even unimodular lattice is a Siegel modular form"
  description: >-
    Let L be an even unimodular lattice of rank 2k and n a finite index type. The theta series
    Θ_L(Z) = ∑_{x ∈ Lⁿ} exp(πi tr(G(x)Z)), G(x) the Gram matrix of the tuple x, converges
    absolutely when Im Z is positive definite, is holomorphic in the entries of Z, is bounded on
    each region Im Z ≥ c·1, and satisfies Θ_L((AZ + B)(CZ + D)⁻¹) = det(CZ + D)^k Θ_L(Z) for
    every (A B; C D) in Sp(2n, ℤ) and every Z in the Siegel upper half-space. So Θ_L is a Siegel
    modular form of degree n and weight k. The transformation law is proved on three kinds of
    generator. Translations Z ↦ Z + S and the maps Z ↦ UZUᵀ are reindexings of the sum. The
    inversion Z ↦ −Z⁻¹ is reduced to the inversion formula for a theta series in one variable:
    for Z = τ·Y with Y real positive definite, Θ_L(Z) is the one-variable theta series of the
    lattice Lⁿ twisted by a square root of Y, to which TauCeti's inversion formula (Poisson
    summation) applies; the identity theorem along the path s ↦ s·Re Z + i·Im Z then gives all of
    the Siegel upper half-space. Finally Sp(2n, ℤ) is generated by the inversion, the
    translations and the image of GL(n, ℤ).
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11F46", "11F27", "11H06"]

sources:
  - title: "Siegelsche Modulfunktionen"
    authors:
      - "E. Freitag"
    id: "Grundlehren der mathematischen Wissenschaften 254, Springer (1983); doi:10.1007/978-3-642-68649-8"
    type: "book"
    relationship: "independently-proves"
    note: >-
      Standard reference for theta series as Siegel modular forms and for the generators of the
      Siegel modular group. The Lean proof was written without the text and takes a different
      route for the inversion (reduction to one variable and the identity theorem, in place of a
      Fourier transform with a matrix parameter). Chapter and page were not checked for this
      file; the volume number is stated from memory.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Introductory Lectures on Siegel Modular Forms"
    authors:
      - "H. Klingen"
    id: "Cambridge Studies in Advanced Mathematics 20, Cambridge University Press (1990); doi:10.1017/CBO9780511619878"
    type: "book"
    relationship: "background"
    note: >-
      Standard reference for Siegel modular forms. Not consulted for the proof; chapter and
      page were not checked for this file; the series number is stated from memory.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/TauCetiProject/TauCeti/tree/83769e442d55cda9d85b3927a93b286831c595ff"
    relationship: "builds-on"
    note: >-
      Imported as a dependency. Used: lattices in Euclidean space with their duals and
      covolumes, the theta series of a lattice in one variable and its inversion formula
      (NumberTheory/ModularForms/ThetaSeries/Inversion.lean), and the summability of Gaussian
      sums over a lattice. New here: the Siegel upper half-space and Siegel modular forms, the
      theta series in degree n, its inversion on the Siegel upper half-space, and the
      generation of Sp(2n, ℤ).
  - id: "https://github.com/Cobord/ZetaThetaFunctions"
    relationship: "other"
    note: >-
      Reported (scan of 10 November 2026) to contain the Siegel upper half-space and a
      transformation law for the Riemann theta function. Not used and not compared in detail.

status:
  scope: >-
    Fully proved for every finite index type n and every even unimodular lattice of rank 2k.
    The proof files also contain: the definition of Siegel modular forms with the theta series
    as an element (thetaModularForm), the agreement with Mathlib's modular forms in degree one,
    and the theta series of the E₈ lattice as a form of weight 4 in every degree. Not included
    in the selected statements: Fourier expansions, cusp forms, Eisenstein series, Hecke
    operators.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The author asked for Siegel modular forms built from theta series and set the order of
        work. Claude, through Claude Code, surveyed Mathlib, TauCeti and the AxiomMath
        libraries, chose the route for the inversion, and wrote the statements and the Lean
        proofs. The proof that Sp(2n, ℤ) is generated by the standard matrices was written by a
        Claude subagent from a plan written in the main session, and checked again there. The
        Lean kernel and Comparator verified the result.
      cost:
        wall_time: "about three days of sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: "The Challenge imports only Mathlib; the proof depends on TauCeti (AI-written, Apache-2.0)."

fidelity:
  divergences: >-
    The Challenge defines the theta series directly as a sum over tuples, and states evenness
    and unimodularity in terms of the inner product, so that it needs no definitions beyond
    Mathlib. Holomorphy is stated for the function of all n² entries on the open set of
    matrices whose symmetric part has positive definite imaginary part; the series depends only
    on the symmetric part. Boundedness is stated on the regions Im Z ≥ c·1 with c > 0.

review:
  status: "self-assessed"
  reviewers: []
  notes: "Not independently reviewed."

alignment:
  namespace: "SiegelTheta"
  statements:
    - source: "Absolute convergence of the theta series on the Siegel upper half-space"
      lean: "SiegelTheta.summable_norm"
      module: "TauTrack.SiegelTheta.Challenge"
      status: "proved"
    - source: "Holomorphy of the theta series"
      lean: "SiegelTheta.differentiableOn"
      module: "TauTrack.SiegelTheta.Challenge"
      status: "proved"
    - source: "Transformation law of weight k under Sp(2n, ℤ)"
      lean: "SiegelTheta.map_symplectic"
      module: "TauTrack.SiegelTheta.Challenge"
      status: "proved"
    - source: "Boundedness at infinity"
      lean: "SiegelTheta.bounded"
      module: "TauTrack.SiegelTheta.Challenge"
      status: "proved"
