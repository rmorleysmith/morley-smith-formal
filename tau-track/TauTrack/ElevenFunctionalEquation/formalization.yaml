    - source: "Hecke's functional equation for 11.2.a.a with root number +1; L(f, 1) > 0; reality on the critical line"
      lean: "ElevenFunctionalEquation.exists_newform_functional_equation"
      module: "TauTrack.ElevenFunctionalEquation.Challenge"
      status: "proved"
