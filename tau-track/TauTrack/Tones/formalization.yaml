# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The twelve characters of the modular group"
  description: >-
    Every homomorphism χ from SL(2, ℤ) to a commutative group satisfies χ(S) = χ(T)⁻³ and
    χ(T)¹² = 1 and is determined by χ(T), for the generators S = (0 −1; 1 0), T = (1 1; 0 1).
    There is an additive map p : SL(2, ℤ) → ℤ/12 with p(T) = 1, p(S) = 9, p(−1) = 6, given on
    (a b; c d) by (a + d)c − bd(c² − 1) − 3c for odd c and by
    (a + d)c − bd(c² − 1) + 3d − 3 − 3cd for even c (entries modulo 12), such that the Dedekind eta
    function satisfies η(γτ)² = e^{2πi p(γ)/12}(cτ + d)η(τ)², and every character SL(2, ℤ) → ℂˣ is
    γ ↦ e^{2πi k p(γ)/12} for exactly one k in ℤ/12. So the modular group has exactly twelve
    characters, the powers of the multiplier of η² = Δ^{1/12}, and its largest abelian quotient
    is ℤ/12.
    Method: (1) S² = −1 and (ST)³ = −1 give χ(S)² = χ(S)³χ(T)³, hence χ(S) = χ(T)⁻³ and
    χ(T)¹² = 1; S and T generate, so χ(T) determines χ. (2) η(τ + 1) = e^{2πi/24}η(τ) and
    η(−1/τ)² = −iτη(τ)² give the multiplier of η² on T and S; the explicit exponent is checked
    to change by +1 under right multiplication by T and by −3 under S, for all entries modulo 12,
    by a finite computation, and the formula follows by induction on words in S and T.
    (3) The multiplier at T is a primitive twelfth root of unity, so its powers are twelve
    distinct characters, and by (1) there are no others.
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT", "math.GR"]
  msc2020: ["11F20", "20H05", "11F06"]

sources:
  - title: "Modular Functions and Dirichlet Series in Number Theory"
    authors:
      - "Tom M. Apostol"
    id: "Graduate Texts in Mathematics 41, 2nd ed., Springer, 1990, Chapter 3"
    type: "book"
    relationship: "independently-proves"
    note: >-
      Dedekind's functional equation η(γτ) = ε(γ)(cτ + d)^{1/2}η(τ), with ε a 24th root of unity
      given by a Dedekind sum. Squaring gives the transformation law of η² with a twelfth root of
      unity. The Lean proof does not use Dedekind sums: it verifies an explicit exponent on the
      generators. The chapter was not consulted for this file; the theorem number was not
      checked.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Modular Functions in Analytic Number Theory"
    authors:
      - "Marvin I. Knopp"
    id: "Markham, Chicago, 1970, Chapter 4"
    type: "book"
    relationship: "independently-proves"
    note: >-
      Source, from memory, of the closed formula for the multiplier of η without Dedekind sums
      (often attributed to Rademacher): a Jacobi symbol times e^{πi[(a + d)c − bd(c² − 1) − 3c]/12}
      for odd c, and the companion formula for even c. Squaring removes the Jacobi symbol and
      gives the exponent stated here. The book was not consulted for this file, and neither the
      chapter nor the theorem number was checked; the formula was verified in Lean on the
      generators and numerically before formalising.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Trees"
    authors:
      - "Jean-Pierre Serre"
    id: "Springer, 1980, Chapter I, §4"
    type: "book"
    relationship: "background"
    note: >-
      SL(2, ℤ) is the amalgam of ℤ/4 and ℤ/6 over ℤ/2, generated by S and ST, from which the
      abelianisation ℤ/12 follows. Cited from memory; the section number was not checked. The
      Lean proof uses only S² = −1, (ST)³ = −1 and generation by S and T.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/TauCetiProject/TauCeti/tree/83769e442d55cda9d85b3927a93b286831c595ff"
    relationship: "builds-on"
    note: >-
      Imported as a dependency. Used: η(−1/τ)² = −iτη(τ)². Mathlib supplies η, the generation of
      SL(2, ℤ) by S and T, and the slash action. A search of this TauCeti commit and its Mathlib
      on 21 November 2026 found the triangle-group presentation of PSL(2, ℤ) in TauCeti but no
      statement of the characters or the abelianisation of SL(2, ℤ), and no multiplier of η².
  - id: "https://github.com/rmorleysmith/morley-smith-formal/tree/main/tau-track/TauTrack/LevelEleven"
    relationship: "builds-on"
    note: >-
      The author's result on the newform of level 11, whose proof introduced the explicit
      exponent of the multiplier of η² and its behaviour under S and T. Here that exponent is
      shown to be additive and to give all characters of SL(2, ℤ).

status:
  scope: >-
    Fully proved. Not included: the multiplier of η itself (a character of the metaplectic
    double cover, with values in 24th roots of unity); the statement that the kernel of p is
    the commutator subgroup, of which only the equivalent statement on characters with values in
    commutative groups generated by one element of order dividing 12 is proved; the congruence
    subgroup property of that kernel; the Galois action on the twelve characters.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The author proposed reading the twelve-tone scale through a twelve-fold structure on the
        modular group and asked for the characters of SL(2, ℤ). Claude, through Claude Code,
        identified the multiplier of η² as the generator, found and checked the explicit
        exponent numerically, wrote the statements and the Lean proofs, and the Lean kernel and
        Comparator verified the result.
      cost:
        wall_time: "a few hours, across two sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: "The Challenge imports only Mathlib; the proof depends on TauCeti (AI-written, Apache-2.0)."

fidelity:
  divergences: >-
    The additive map p is given as a function with p(γδ) = p(γ) + p(δ) rather than as a group
    homomorphism to Multiplicative (ℤ/12). The factor cτ + d is written out from the integer
    entries of γ. The classification of characters is stated for values in ℂˣ; the relations
    χ(S) = χ(T)⁻³ and χ(T)¹² = 1 are stated for every commutative group.

review:
  status: "self-assessed"
  reviewers: []
  notes: "Not independently reviewed."

alignment:
  namespace: "Tones"
  statements:
    - source: "A character of SL(2, ℤ) is determined by its value on T, a twelfth root of unity"
      lean: "Tones.character_determined"
      module: "TauTrack.Tones.Challenge"
      status: "proved"
    - source: "The multiplier of η², its explicit exponent modulo 12, and the twelve characters of SL(2, ℤ)"
      lean: "Tones.exists_pitch"
      module: "TauTrack.Tones.Challenge"
      status: "proved"
