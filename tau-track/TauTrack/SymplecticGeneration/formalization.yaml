# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Generators of the integral symplectic group Sp(2n, ℤ)"
  description: >-
    For every finite index type n, the integral symplectic group Sp(2n, ℤ) is generated by the
    matrix J = (0 −1; 1 0), the translations (1 S; 0 1) with S symmetric, and the matrices
    (U 0; 0 Vᵀ) with UV = VU = 1 (the image of GL(n, ℤ)). The proof does not induct on n. It
    inducts on a set s of indices: every symplectic matrix that fixes the basis vectors e_j,
    j ∈ s, of the first half of ℤⁿ ⊕ ℤⁿ lies in the generated subgroup. In the step, the
    column M e_i = (a, c) is moved to e_i by elements that fix the e_j: first Euclid's algorithm
    in each coordinate k ∉ s makes c = 0, using (1 tE_kk; 0 1) and its conjugate by J; then a
    descent on the sum of |a_k| over k ∉ s, by units of M_n(ℤ) of the form 1 + c·e_lᵀ, reduces
    a to e_i, the last nonzero entry being ±1 because a row of the inverse matrix gives a
    Bezout relation.
  authors:
    - "Richard Morley-Smith"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Richard Morley-Smith"

classification:
  arxiv: ["math.NT", "math.GR"]
  msc2020: ["11F46", "20H05", "15B36"]

sources:
  - title: "On the generators of the symplectic modular group"
    authors:
      - "L. K. Hua"
      - "I. Reiner"
    id: "Transactions of the American Mathematical Society 65 (1949), 415–426; doi:10.1090/S0002-9947-1949-0029942-0"
    type: "paper"
    relationship: "independently-proves"
    note: >-
      Classical reference for generators of the symplectic modular group. The Lean proof does
      not follow the text of the paper, which was not consulted; the argument formalised is the
      standard Euclidean-algorithm proof, arranged to avoid induction on the degree. The paper's
      generating sets are smaller than the one used here (stated from memory, not checked).
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/TauCetiProject/TauCeti/tree/83769e442d55cda9d85b3927a93b286831c595ff"
    relationship: "other"
    note: >-
      TauCeti proves generation of the symplectic group over a field by root subgroups and the
      torus (LinearAlgebra/Matrix/GeneralLinearGroup/Symplectic/GaussianGeneration.lean). That
      result does not cover ℤ and is not used here. The proof of this result imports only
      Mathlib.

status:
  scope: >-
    Fully proved, for every finite index type with decidable equality. Not proved: that smaller
    generating sets suffice (for example J and the translations alone).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The author asked for the theta series of an even unimodular lattice as a Siegel modular
        form; this theorem was the last missing step. Claude, through Claude Code, searched
        Mathlib, TauCeti and the AxiomMath libraries for the statement, wrote the proof plan,
        and a Claude subagent wrote the Lean proof from that plan. The build, the absence of
        sorry and the axioms were then checked again in the main session, and the Lean kernel
        and Comparator verified the result.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: "The Challenge and the proof import only Mathlib."

fidelity:
  divergences: >-
    The generating set is written as a set-builder over block matrices so that the Challenge
    needs no new definitions. The third family is given by pairs (U, V) with UV = VU = 1 rather
    than by elements of GL(n, ℤ).

review:
  status: "self-assessed"
  reviewers: []
  notes: "Not independently reviewed."

alignment:
  namespace: "SymplecticGeneration"
  statements:
    - source: "Classical generation theorem for the Siegel modular group (cf. Hua–Reiner 1949)"
      lean: "SymplecticGeneration.closure_eq_top"
      module: "TauTrack.SymplecticGeneration.Challenge"
      status: "proved"
