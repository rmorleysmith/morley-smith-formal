name = "MorleySmithFormal"
version = "1.0.0"
defaultTargets = ["MorleySmithFormal"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# MorleySmithFormal.lean and every module under MorleySmithFormal/ are built, including each result's Challenge and Solution.
[[lean_lib]]
name = "MorleySmithFormal"
globs = ["MorleySmithFormal.*"]
